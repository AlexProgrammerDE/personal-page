lefthook: bunx --no-install lefthook
min_version: 2.2.2

pre-commit:
  commands:
    biome:
      run: bunx --no-install biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  commands:
    types:
      glob: "*.{ts,tsx,json,jsonc}"
      run: bun run typecheck
