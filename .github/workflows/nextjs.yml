name: "Build and Test"

on:
  - push
  - pull_request

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and Test

    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: |
          bun run typecheck

      - name: Run check
        run: |
          bunx biome ci

      - name: Run build
        run: |
          bun run build

      - name: Validate Cloudflare artifact
        run: bun run deploy:dry-run

      - name: Deploy production to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CF_SEND_TELEMETRY: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf deploy --prebuilt

      - name: Upload a preview version to Cloudflare
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          CF_SEND_TELEMETRY: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf workers versions create --prebuilt
